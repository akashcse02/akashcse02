name: Generate Snake & 3D Contribution SVGs

on:
  schedule:
    # runs once every day at 00:00 UTC — GitHub caches the contribution
    # graph, so daily is enough; change if you want it more/less frequent
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: akashcse02
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-3d.svg
            dist/github-contribution-grid-3d-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%23164E63,%230E7490,%2306B6D4,%2322D3EE,%2367E8F9

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
